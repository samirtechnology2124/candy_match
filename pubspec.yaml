name: candy_match
description: "Professional Match 3 Puzzle Game"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  flame_audio: ^2.0.4
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3 # for saving high score
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/logo.png 

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21